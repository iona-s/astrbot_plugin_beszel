name: 功能建议
description: 提出新的查询、渲染、Webhook 或兼容性需求
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 希望解决的问题
      description: 说明当前场景、限制以及为什么需要这个功能。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望行为、交互方式或可参考的上游实现。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案
      description: 可选，说明已考虑的替代方式或临时解决办法。
